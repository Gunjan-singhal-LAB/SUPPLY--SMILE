<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Supply Smile">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Procedure use · Supply Smile</title>
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header id="topbar"></header>
  <div class="d-flex layout">
    <nav id="sidebar"></nav>
    <main class="flex-grow-1 p-3 p-md-4 use-page">
      <h1 class="page-title mb-0">Procedure use</h1>
      <p class="page-sub">Tap the procedure. Its usual materials fill in. Change anything, then Save.</p>

      <div class="row g-3">
        <div class="col-lg-7">
          <section class="card use-card mb-3">
            <div class="use-step"><span class="use-num">1</span>Procedure</div>
            <div class="chip-grid" id="procedures" role="radiogroup" aria-label="Procedure"></div>
            <div class="mt-3 small text-secondary">
              Date: <button class="btn btn-link btn-sm p-0 align-baseline" type="button" id="date-btn">Today</button>
              <input class="form-control form-control-sm d-inline-block w-auto ms-1 d-none" type="date" id="date" aria-label="Date">
            </div>
          </section>

          <section class="card use-card mb-3">
            <div class="use-step d-flex align-items-center"><span class="use-num">2</span>Materials used
              <a class="small ms-auto fw-normal d-none" id="edit-kit" href="kits.html"><i class="bi bi-pencil me-1"></i>Edit this kit</a></div>
            <div id="quick" class="d-flex flex-wrap gap-2 mb-2"></div>
            <div id="lines" class="use-lines"></div>
            <div class="picker mt-2">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-plus-lg"></i></span>
                <input class="form-control" id="add-search" placeholder="Add another item: type to search" autocomplete="off"
                       role="combobox" aria-expanded="false" aria-controls="add-results" aria-label="Add item">
              </div>
              <div class="list-group picker-results d-none" id="add-results" role="listbox"></div>
            </div>
            <div class="alert alert-danger small mt-3 mb-0 d-none" id="form-error" role="alert"></div>
          </section>
        </div>

        <div class="col-lg-5">
          <section class="card dash-card">
            <div class="dash-card-head"><div><h2 class="dash-card-title">Saved today</h2>
              <p class="dash-card-sub">Latest first · Undo is possible for 2 minutes</p></div></div>
            <ul class="recent-list" id="today-list"></ul>
          </section>
        </div>
      </div>

      <!-- Save bar stays in reach at the bottom of the screen -->
      <div class="save-bar">
        <div class="small text-secondary" id="save-summary">Choose a procedure</div>
        <button class="btn btn-primary btn-lg px-4" type="button" id="save" disabled><i class="bi bi-check2-circle me-1"></i>Save</button>
      </div>
    </main>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fb-core.js"></script>
  <script src="js/fb-inventory.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/common.js"></script>
  <script>
    const GENERAL = 'general';        // "General use": everyday consumables not tied to one procedure
    startPage(async me => {
      const isAdmin = me.role === 'ADMIN';
      const [meta, kitRes, itemRes] = await Promise.all([api.get('/api/meta'), api.get('/api/kits'), api.get('/api/items')]);
      let items = itemRes.items;
      const kits = Object.fromEntries(kitRes.kits.map(k => [k.procedureId, k]));
      let procedureId = null, lines = [];               // lines: {itemId, qty, anyway}
      const itemById = id => items.find(i => i.id === id);
      const procName = () => procedureId === GENERAL ? 'General use' : (meta.procedures.find(x => x.id === procedureId) || {}).name;

      // ---------- procedure chips ----------
      function renderProcedures() {
        const chip = (id, title, sub, icon) => el('button', { class: 'chip-btn' + (id === procedureId ? ' selected' : '') + (id === GENERAL ? ' chip-general' : ''),
          type: 'button', role: 'radio', 'aria-checked': String(id === procedureId), onclick: () => pickProcedure(id) },
          el('span', { class: 'd-block fw-semibold' }, icon ? el('i', { class: 'bi bi-' + icon + ' me-1' }) : null, title),
          el('span', { class: 'd-block chip-sub', text: sub }));
        $('procedures').replaceChildren(
          ...meta.procedures.map(p => {
            const n = (kits[p.id] || { lines: [] }).lines.length;
            return chip(p.id, p.name, n ? `${n} item${n === 1 ? '' : 's'} in kit` : 'No kit yet');
          }),
          chip(GENERAL, 'General use', 'Gloves, masks, cotton…', 'box2'));
      }
      function pickProcedure(id) {
        procedureId = id;
        const k = id === GENERAL ? null : kits[id];
        lines = (k ? k.lines : []).map(l => ({ itemId: l.itemId, qty: l.qty, anyway: false }));
        $('edit-kit').classList.toggle('d-none', !isAdmin || id === GENERAL);
        $('edit-kit').href = 'kits.html?procedure=' + id;
        renderProcedures(); renderLines();
      }

      // ---------- lines ----------
      function renderLines() {
        const box = $('lines');
        box.replaceChildren();
        if (!lines.length) {
          box.append(el('div', { class: 'use-empty', text: procedureId === GENERAL
            ? 'Tap an item above or search below to add what was taken.'
            : (procedureId ? 'This procedure has no kit yet. Add the items used below.' : 'Choose a procedure first.') }));
        }
        lines.forEach((l, idx) => {
          const it = itemById(l.itemId);
          const qtyInput = el('input', { class: 'form-control text-center', type: 'number', min: '0', value: String(l.qty),
            inputmode: 'numeric', 'aria-label': `Quantity of ${it.name}`,
            oninput: e => { l.qty = Math.max(0, parseInt(e.target.value || '0', 10) || 0); renderLineState(wrap, l, it); updateSave(); } });
          const row = el('div', { class: 'use-line' },
            el('div', { class: 'min-w-0 flex-grow-1' },
              el('div', { class: 'fw-semibold text-truncate', text: it.name }),
              el('div', { class: 'use-have small' })),
            el('div', { class: 'input-group input-group-sm stepper-sm' },
              el('button', { class: 'btn btn-outline-secondary', type: 'button', 'aria-label': 'Less',
                onclick: () => { l.qty = Math.max(0, l.qty - 1); qtyInput.value = l.qty; renderLineState(wrap, l, it); updateSave(); } }, '−'),
              qtyInput,
              el('button', { class: 'btn btn-outline-secondary', type: 'button', 'aria-label': 'More',
                onclick: () => { l.qty += 1; qtyInput.value = l.qty; renderLineState(wrap, l, it); updateSave(); } }, '+')),
            el('span', { class: 'use-unit small text-secondary', text: it.unit }),
            el('button', { class: 'btn btn-sm btn-link text-secondary px-1', type: 'button', 'aria-label': `Remove ${it.name}`,
              onclick: () => { lines.splice(idx, 1); renderLines(); } }, el('i', { class: 'bi bi-x-lg' })));
          const flag = el('label', { class: 'use-anyway small d-none' },
            el('input', { class: 'form-check-input me-2', type: 'checkbox', onchange: e => { l.anyway = e.target.checked; updateSave(); } }),
            'Used anyway: record it and flag a stock check');
          const wrap = el('div', { class: 'use-line-wrap' }, row, flag);
          box.append(wrap);
          renderLineState(wrap, l, it);
        });
        renderQuick(); updateSave();
      }
      function renderLineState(wrap, l, it) {
        const short = l.qty > it.qty;
        wrap.querySelector('.use-line').classList.toggle('is-zero', l.qty === 0);
        const have = wrap.querySelector('.use-have');
        have.className = 'use-have small ' + (short ? 'text-danger fw-semibold' : 'text-secondary');
        have.textContent = short ? `Only ${it.qty} ${it.unit} on record` : `${it.qty} ${it.unit} in stock`;
        const flag = wrap.querySelector('.use-anyway');
        flag.classList.toggle('d-none', !short);
        if (!short) { l.anyway = false; flag.querySelector('input').checked = false; }
      }
      function addItem(it) {
        const existing = lines.find(l => l.itemId === it.id);
        if (existing) existing.qty += 1; else lines.push({ itemId: it.id, qty: 1, anyway: false });
        renderLines();
      }
      // General use: everyday consumables as one-tap chips.
      function renderQuick() {
        const q = $('quick');
        q.replaceChildren();
        if (procedureId !== GENERAL) return;
        items.filter(i => i.bulk && i.active).forEach(i => q.append(el('button', { class: 'recent-chip', type: 'button', onclick: () => addItem(i) },
          el('i', { class: 'bi bi-plus me-1' }), i.name)));
      }

      // ---------- search to add ----------
      const search = $('add-search'), results = $('add-results');
      let focusIdx = -1, found = [];
      function showResults() {
        const t = search.value.trim().toLowerCase();
        found = t ? items.filter(i => i.active && i.name.toLowerCase().includes(t)).slice(0, 8) : [];
        focusIdx = found.length ? 0 : -1;
        results.replaceChildren(...found.map((i, n) => el('button', { class: 'list-group-item list-group-item-action d-flex justify-content-between' + (n === 0 ? ' focused' : ''),
          type: 'button', role: 'option', onclick: () => { addItem(i); search.value = ''; showResults(); search.focus(); } },
          el('span', { text: i.name }), el('span', { class: 'small text-secondary', text: `${i.qty} ${i.unit}` }))));
        if (t && !found.length) results.append(el('div', { class: 'list-group-item small text-secondary', text: 'No item found.' }));
        results.classList.toggle('d-none', !t);
        search.setAttribute('aria-expanded', String(!!t));
      }
      search.addEventListener('input', showResults);
      search.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          focusIdx = Math.max(0, Math.min(found.length - 1, focusIdx + (e.key === 'ArrowDown' ? 1 : -1)));
          [...results.children].forEach((c, n) => c.classList.toggle('focused', n === focusIdx));
        } else if (e.key === 'Enter' && found[focusIdx]) {
          e.preventDefault(); addItem(found[focusIdx]); search.value = ''; showResults();
        } else if (e.key === 'Escape') { search.value = ''; showResults(); }
      });
      document.addEventListener('click', e => { if (!e.target.closest('.picker')) results.classList.add('d-none'); });

      // ---------- date ----------
      $('date').value = me.today; $('date').max = me.today;
      $('date-btn').addEventListener('click', () => { $('date').classList.toggle('d-none'); $('date').focus(); });
      $('date').addEventListener('change', () => { $('date-btn').textContent = $('date').value === me.today ? 'Today' : fmtDate($('date').value); });

      // ---------- save ----------
      function problems() {
        const active = lines.filter(l => l.qty > 0);
        if (!procedureId) return 'Choose a procedure';
        if (!active.length) return 'Add at least one item';
        const short = active.filter(l => l.qty > itemById(l.itemId).qty && !l.anyway);
        if (short.length) return `${itemById(short[0].itemId).name}: not enough on record. Tick "Used anyway" or lower it`;
        return '';
      }
      function updateSave() {
        const p = problems(), n = lines.filter(l => l.qty > 0).length;
        $('save').disabled = !!p;
        $('save-summary').textContent = p || `${procName()} · ${n} item${n === 1 ? '' : 's'}`;
      }
      $('save').addEventListener('click', async () => {
        if (problems()) return;
        $('save').disabled = true; $('form-error').classList.add('d-none');
        const general = procedureId === GENERAL;
        const body = { reason: general ? 'ISSUE' : 'PROCEDURE_USE', procedureId: general ? null : procedureId,
          txnDate: $('date').value || me.today,
          lines: lines.filter(l => l.qty > 0).map(l => ({ itemId: l.itemId, qty: l.qty, usedAnyway: l.anyway })) };
        try {
          const name = procName();
          const r = await api.post('/api/use', body);
          toast(`Saved · ${name}: ${r.lines.length} item${r.lines.length === 1 ? '' : 's'}.` + (r.flags.length ? ` ${r.flags.length} flagged for a stock check.` : ''),
            'success', { label: 'Undo', seconds: 15, fn: async () => {
              try { await api.post(`/api/use/${r.group}/undo`); toast('Undone. Stock is back.', 'secondary'); await refresh(); }
              catch (err) { showError(err); } } });
          procedureId = null; lines = [];
          $('edit-kit').classList.add('d-none');
          await refresh();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          $('form-error').textContent = err.message; $('form-error').classList.remove('d-none');
          updateSave();
        }
      });

      // ---------- today's entries (one row per save) ----------
      async function refresh() {
        const [fresh, recent] = await Promise.all([api.get('/api/items'), api.get('/api/stock/recent?type=OUT&limit=60')]);
        items = fresh.items;
        const groups = [];
        recent.entries.filter(t => t.date === me.today && ['PROCEDURE_USE', 'ISSUE'].includes(t.reason)).forEach(t => {
          const key = t.group || 't' + t.id;
          let g = groups.find(x => x.key === key);
          if (!g) groups.push(g = { key, t, parts: [] });
          g.parts.push(`${t.qty} ${t.unit} ${t.itemName}`);
        });
        $('today-list').replaceChildren(...groups.slice(0, 10).map(g => el('li', {},
          el('span', { class: 'rl-ic out' }, el('i', { class: 'bi bi-' + (g.t.reason === 'ISSUE' ? 'box2' : 'clipboard2-pulse') })),
          el('div', { class: 'min-w-0 flex-grow-1' },
            el('div', { class: 'rl-name text-truncate', text: g.t.reason === 'ISSUE' ? 'General use' : g.t.procedureName }),
            el('div', { class: 'rl-sub use-parts', text: g.parts.join(', ') })),
          el('div', { class: 'rl-sub text-end flex-shrink-0', text: `${(g.t.createdAt || '').slice(11, 16)}\n${g.t.userName.split(' ')[0]}` }))));
        if (!groups.length) $('today-list').append(el('li', { class: 'small text-secondary', text: 'Nothing recorded yet today.' }));
        renderProcedures(); renderLines();
      }
      await refresh();
    });
  </script>
</body>
</html>
