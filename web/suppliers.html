<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Supply Smile">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Suppliers · Supply Smile</title>
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <header id="topbar"></header>
  <div class="d-flex layout">
    <nav id="sidebar"></nav>
    <main class="flex-grow-1 p-3 p-md-4">
      <div class="d-flex flex-wrap align-items-start justify-content-between gap-2">
        <div>
          <h1 class="page-title">Suppliers</h1>
          <p class="page-sub">Who you buy from, and what you bought from them</p>
        </div>
        <button class="btn btn-primary admin-only" type="button" id="btn-add"><i class="bi bi-plus-lg me-1"></i>Add supplier</button>
      </div>
      <div class="row g-3">
        <div class="col-lg-5"><div class="list-group" id="sup-list"></div></div>
        <div class="col-lg-7">
          <div class="card d-none" id="detail">
            <div class="card-body border-bottom">
              <div class="d-flex justify-content-between align-items-start">
                <div><h2 class="h5 mb-1" id="s-name"></h2><div class="small text-secondary" id="s-contact"></div></div>
                <button class="btn btn-sm btn-outline-secondary admin-only" type="button" id="btn-edit"><i class="bi bi-pencil me-1"></i>Edit</button>
              </div>
              <div class="small mt-2" id="s-items"></div>
            </div>
            <div class="card-header bg-white fw-semibold border-top-0">Purchase history</div>
            <div class="table-responsive"><table class="table table-stack table-sm mb-0 align-middle">
              <thead><tr><th>Date</th><th>Invoice</th><th>Item</th><th class="text-end">Qty</th><th class="text-end">Unit cost</th></tr></thead>
              <tbody id="s-history"></tbody>
            </table></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="sup-modal" tabindex="-1" aria-labelledby="sup-title" aria-hidden="true">
    <div class="modal-dialog"><form class="modal-content" id="sup-form" novalidate>
      <div class="modal-header"><h2 class="modal-title fs-5" id="sup-title">Add supplier</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body row g-3">
        <div class="col-12"><label class="form-label required" for="m-name">Supplier name</label>
          <input class="form-control" id="m-name" required maxlength="120"><div class="invalid-feedback">Enter the supplier name.</div></div>
        <div class="col-md-6"><label class="form-label" for="m-contact">Contact person</label><input class="form-control" id="m-contact" maxlength="100"></div>
        <div class="col-md-6"><label class="form-label" for="m-phone">Phone</label><input class="form-control" id="m-phone" type="tel" maxlength="20"></div>
        <div class="col-12"><label class="form-label" for="m-email">Email</label><input class="form-control" id="m-email" type="email" maxlength="120"></div>
        <div class="col-12"><label class="form-label" for="m-address">Address</label><textarea class="form-control" id="m-address" rows="2" maxlength="255"></textarea></div>
        <div class="col-12"><div class="text-danger small" id="m-error" role="alert"></div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save supplier</button>
      </div>
    </form></div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/fb-core.js"></script>
  <script src="js/fb-inventory.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/common.js"></script>
  <script>
    startPage(async () => {
      let suppliers = [], current = null, editing = false;
      const modal = bootstrap.Modal.getOrCreateInstance($('sup-modal'));

      async function load(selectId) {
        suppliers = (await api.get('/api/suppliers')).suppliers;
        current = suppliers.find(s => s.id === selectId) || suppliers[0] || null;
        renderList(); await renderDetail();
      }
      function renderList() {
        $('sup-list').replaceChildren(...suppliers.map(s => {
          const on = current && s.id === current.id;
          return el('button', { type: 'button', 'aria-current': on ? 'true' : null,
            class: 'list-group-item list-group-item-action d-flex justify-content-between align-items-center' + (on ? ' active' : ''),
            onclick: async () => { current = s; renderList(); await renderDetail(); } },
            el('span', {}, el('span', { class: 'fw-semibold d-block', text: s.name }),
              el('span', { class: 'small ' + (on ? '' : 'text-secondary'), text: [s.contactPerson, s.phone].filter(Boolean).join(' · ') || '-' })),
            el('span', { class: 'badge rounded-pill text-bg-light', text: `${s.deliveries} deliveries` }));
        }));
        if (!suppliers.length) $('sup-list').append(el('div', { class: 'list-group-item text-secondary', text: 'No suppliers yet.' }));
      }
      async function renderDetail() {
        if (!current) { $('detail').classList.add('d-none'); return; }
        const d = await api.get('/api/suppliers/' + current.id);
        const s = d.supplier;
        $('s-name').textContent = s.name;
        const bits = [['person', s.contactPerson], ['telephone', s.phone], ['envelope', s.email], ['geo-alt', s.address]].filter(b => b[1]);
        $('s-contact').replaceChildren(...bits.map(([ic, v]) => el('span', { class: 'me-3 d-inline-block' }, el('i', { class: `bi bi-${ic} me-1` }), v)));
        $('s-items').textContent = 'Default supplier for: ' + (d.defaultFor.join(', ') || '-');
        $('s-history').replaceChildren(...d.purchases.map(t => {
          const r = tr(fmtDate(t.date), t.invoiceNo || '-', t.itemName, `${t.qty} ${t.unit}`, '₹' + t.unitCost);
          r.children[3].classList.add('text-end'); r.children[4].classList.add('text-end'); return r;
        }));
        if (!d.purchases.length) $('s-history').append(emptyRow(5, 'No purchases recorded yet.'));
        $('detail').classList.remove('d-none');
      }

      $('btn-add').addEventListener('click', () => {
        editing = false; $('sup-title').textContent = 'Add supplier';
        $('sup-form').reset(); $('sup-form').classList.remove('was-validated'); $('m-error').textContent = ''; modal.show();
      });
      $('btn-edit').addEventListener('click', () => {
        editing = true; $('sup-title').textContent = 'Edit supplier'; $('m-error').textContent = '';
        $('m-name').value = current.name; $('m-contact').value = current.contactPerson || '';
        $('m-phone').value = current.phone || ''; $('m-email').value = current.email || ''; $('m-address').value = current.address || '';
        modal.show();
      });
      $('sup-form').addEventListener('submit', async e => {
        e.preventDefault();
        if (!e.target.checkValidity()) { e.target.classList.add('was-validated'); return; }
        const data = { name: $('m-name').value, contactPerson: $('m-contact').value, phone: $('m-phone').value,
          email: $('m-email').value, address: $('m-address').value };
        try {
          const saved = editing ? await api.put('/api/suppliers/' + current.id, data) : await api.post('/api/suppliers', data);
          modal.hide(); toast('Supplier saved.'); await load(saved.id);
        } catch (err) { $('m-error').textContent = err.message; }
      });
      await load();
    });
  </script>
</body>
</html>
